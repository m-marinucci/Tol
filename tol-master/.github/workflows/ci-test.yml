name: CI/CD Infrastructure Test

on:
  push:
    branches: [ feature/cicd-pipeline-clean ]
  pull_request:
    branches: [ master, develop ]
  workflow_dispatch:

jobs:
  test-ci-setup:
    name: Test CI/CD Infrastructure
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Verify CI/CD Files
      run: |
        echo "Checking CI/CD infrastructure..."
        
        # Check main workflow
        if [ -f ".github/workflows/ci-cd.yml" ]; then
          echo "✅ Main CI/CD workflow found"
        else
          echo "❌ Main CI/CD workflow missing"
          exit 1
        fi
        
        # Check scripts
        if [ -f ".github/scripts/performance_monitor.sh" ]; then
          echo "✅ Performance monitoring script found"
        else
          echo "❌ Performance monitoring script missing"
          exit 1
        fi
        
        if [ -f ".github/scripts/deploy_docs.sh" ]; then
          echo "✅ Documentation deployment script found"
        else
          echo "❌ Documentation deployment script missing"
          exit 1
        fi
        
        if [ -f ".github/scripts/create_release.sh" ]; then
          echo "✅ Release automation script found"
        else
          echo "❌ Release automation script missing"
          exit 1
        fi
        
        # Check CMake testing configuration
        if [ -f "tol/cmake/Testing.cmake" ]; then
          echo "✅ CMake testing configuration found"
        else
          echo "❌ CMake testing configuration missing"
          exit 1
        fi
        
        echo "All CI/CD infrastructure files verified successfully!"

    - name: Test Script Permissions
      run: |
        echo "Checking script permissions..."
        
        scripts=(
          ".github/scripts/performance_monitor.sh"
          ".github/scripts/deploy_docs.sh"
          ".github/scripts/create_release.sh"
        )
        
        for script in "${scripts[@]}"; do
          if [ -x "$script" ]; then
            echo "✅ $script is executable"
          else
            echo "❌ $script is not executable"
            exit 1
          fi
        done
        
        echo "All scripts have correct permissions!"

    - name: Validate Workflow Syntax
      run: |
        echo "Validating workflow syntax..."
        
        # Basic YAML syntax check
        if command -v python3 &> /dev/null; then
          python3 -c "
import yaml
import sys

try:
    with open('.github/workflows/ci-cd.yml', 'r') as f:
        yaml.safe_load(f)
    print('✅ Main workflow YAML syntax is valid')
except yaml.YAMLError as e:
    print(f'❌ YAML syntax error: {e}')
    sys.exit(1)
except Exception as e:
    print(f'❌ Error reading workflow: {e}')
    sys.exit(1)
"
        else
          echo "⚠️ Python3 not available, skipping YAML validation"
        fi

    - name: Test CMake Integration
      run: |
        echo "Testing CMake testing integration..."
        
        # Check if Testing.cmake can be parsed
        if grep -q "enable_testing" tol/cmake/Testing.cmake; then
          echo "✅ Testing.cmake contains enable_testing"
        else
          echo "❌ Testing.cmake missing enable_testing"
          exit 1
        fi
        
        if grep -q "add_tol_test" tol/cmake/Testing.cmake; then
          echo "✅ Testing.cmake contains test functions"
        else
          echo "❌ Testing.cmake missing test functions"
          exit 1
        fi
        
        echo "CMake testing integration verified!"

    - name: Check .gitignore Coverage
      run: |
        echo "Verifying .gitignore coverage..."
        
        # Check for essential ignore patterns
        patterns=(
          "autom4te.cache/"
          "aclocal.m4"
          "Makefile.in"
          "build/"
          "CMakeCache.txt"
        )
        
        for pattern in "${patterns[@]}"; do
          if grep -q "$pattern" .gitignore; then
            echo "✅ .gitignore includes $pattern"
          else
            echo "❌ .gitignore missing $pattern"
            exit 1
          fi
        done
        
        echo ".gitignore coverage verified!"

    - name: Summary
      run: |
        echo "🎉 CI/CD Infrastructure Test Summary"
        echo "=================================="
        echo "✅ All CI/CD files present and valid"
        echo "✅ Script permissions correct"
        echo "✅ Workflow syntax validated"
        echo "✅ CMake integration verified"
        echo "✅ .gitignore coverage complete"
        echo ""
        echo "🚀 CI/CD pipeline is ready for deployment!"
