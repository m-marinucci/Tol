name: Build Cache Optimization Tests

on:
  push:
    branches: [ master, develop ]
  pull_request:
    branches: [ master, develop ]
  workflow_dispatch:
  schedule:
    # Run cache optimization tests weekly
    - cron: '0 4 * * 0'

env:
  BUILD_TYPE: Release
  CCACHE_COMPRESS: 1
  CCACHE_COMPRESSLEVEL: 6
  CCACHE_MAXSIZE: 2G

jobs:
  # ============================================================================
  # Cache Performance Benchmark
  # ============================================================================
  cache-performance-benchmark:
    name: Cache Performance Analysis
    runs-on: ubuntu-latest
    strategy:
      matrix:
        cache_type: [ccache, none]
        compiler: [gcc-11, clang-14]
        
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          gcc-11 \
          g++-11 \
          clang-14 \
          clang++-14 \
          cmake \
          ccache \
          time \
          bc \
          libgsl-dev \
          liblapacke-dev \
          libblas-dev \
          libfftw3-dev \
          libbz2-dev \
          libsuitesparse-dev \
          libsparsehash-dev \
          libboost-all-dev \
          libltdl-dev \
          zlib1g-dev

    - name: Setup ccache (if enabled)
      if: matrix.cache_type == 'ccache'
      run: |
        ccache --version
        ccache --show-config
        ccache --zero-stats
        ccache --max-size=${{ env.CCACHE_MAXSIZE }}
        ccache --set-config=compression=true
        ccache --set-config=compression_level=${{ env.CCACHE_COMPRESSLEVEL }}
        
        # Create ccache configuration
        mkdir -p ~/.ccache
        cat > ~/.ccache/ccache.conf << EOF
        max_size = ${{ env.CCACHE_MAXSIZE }}
        compression = true
        compression_level = ${{ env.CCACHE_COMPRESSLEVEL }}
        hash_dir = false
        cache_dir_levels = 2
        EOF

    - name: Cache ccache directory
      if: matrix.cache_type == 'ccache'
      uses: actions/cache@v3
      with:
        path: ~/.ccache
        key: ccache-${{ matrix.compiler }}-${{ hashFiles('tol-master/tol/**/*.cpp', 'tol-master/tol/**/*.h', 'tol-master/tol/CMakeLists.txt', 'tol-master/tol/**/*.cmake') }}
        restore-keys: |
          ccache-${{ matrix.compiler }}-

    - name: Configure Build Environment
      working-directory: tol-master/tol
      env:
        CC: ${{ matrix.compiler == 'gcc-11' && 'gcc-11' || 'clang-14' }}
        CXX: ${{ matrix.compiler == 'gcc-11' && 'g++-11' || 'clang++-14' }}
      run: |
        mkdir -p build-${{ matrix.cache_type }}-${{ matrix.compiler }}
        cd build-${{ matrix.cache_type }}-${{ matrix.compiler }}
        
        CMAKE_ARGS="-DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} -DENABLE_TESTING=ON"
        
        if [ "${{ matrix.cache_type }}" = "ccache" ]; then
          CMAKE_ARGS="$CMAKE_ARGS -DCMAKE_CXX_COMPILER_LAUNCHER=ccache -DCMAKE_C_COMPILER_LAUNCHER=ccache"
        fi
        
        echo "CMAKE_ARGS: $CMAKE_ARGS"
        
        # Time the configuration step
        time cmake .. $CMAKE_ARGS 2>&1 | tee cmake-config.log

    - name: First Build (Cold Cache)
      working-directory: tol-master/tol/build-${{ matrix.cache_type }}-${{ matrix.compiler }}
      run: |
        echo "Starting cold build with ${{ matrix.cache_type }} and ${{ matrix.compiler }}..."
        
        # Clear any existing cache stats
        if [ "${{ matrix.cache_type }}" = "ccache" ]; then
          ccache --zero-stats
        fi
        
        # Time the build
        start_time=$(date +%s%N)
        make -j$(nproc) 2>&1 | tee cold-build.log
        end_time=$(date +%s%N)
        
        cold_build_time=$(echo "scale=2; ($end_time - $start_time) / 1000000000" | bc)
        echo "Cold build time: ${cold_build_time}s" | tee cold-build-time.txt
        
        if [ "${{ matrix.cache_type }}" = "ccache" ]; then
          ccache --show-stats > cold-cache-stats.txt
          echo "Cold cache statistics:"
          cat cold-cache-stats.txt
        fi

    - name: Clean Build Directory
      working-directory: tol-master/tol/build-${{ matrix.cache_type }}-${{ matrix.compiler }}
      run: |
        # 'make clean' should remove all build artifacts including object files.
        # If additional cleaning is needed, document the reason below.
        make clean
        # If you find that 'make clean' does not remove all .o/.obj files, uncomment the following lines:
        # find . -name "*.o" -delete
        # find . -name "*.obj" -delete

    - name: Second Build (Warm Cache)
      working-directory: tol-master/tol/build-${{ matrix.cache_type }}-${{ matrix.compiler }}
      run: |
        echo "Starting warm build with ${{ matrix.cache_type }} and ${{ matrix.compiler }}..."
        
        if [ "${{ matrix.cache_type }}" = "ccache" ]; then
          ccache --zero-stats
        fi
        
        # Time the build
        start_time=$(date +%s%N)
        make -j$(nproc) 2>&1 | tee warm-build.log
        end_time=$(date +%s%N)
        
        warm_build_time=$(echo "scale=2; ($end_time - $start_time) / 1000000000" | bc)
        echo "Warm build time: ${warm_build_time}s" | tee warm-build-time.txt
        
        if [ "${{ matrix.cache_type }}" = "ccache" ]; then
          ccache --show-stats > warm-cache-stats.txt
          echo "Warm cache statistics:"
          cat warm-cache-stats.txt
        fi

    - name: Analyze Cache Performance
      working-directory: tol-master/tol/build-${{ matrix.cache_type }}-${{ matrix.compiler }}
      run: |
        echo "=== Build Performance Analysis ===" | tee performance-analysis.txt
        echo "Compiler: ${{ matrix.compiler }}" | tee -a performance-analysis.txt
        echo "Cache type: ${{ matrix.cache_type }}" | tee -a performance-analysis.txt
        echo "" | tee -a performance-analysis.txt
        
        cold_time=$(cat cold-build-time.txt | grep -o '[0-9]*\.[0-9]*')
        warm_time=$(cat warm-build-time.txt | grep -o '[0-9]*\.[0-9]*')
        
        echo "Cold build time: ${cold_time}s" | tee -a performance-analysis.txt
        echo "Warm build time: ${warm_time}s" | tee -a performance-analysis.txt
        
        if [ "${{ matrix.cache_type }}" = "ccache" ]; then
          # Calculate performance improvement
          if [ -n "$cold_time" ] && [ -n "$warm_time" ] && [ "$cold_time" != "0" ]; then
            improvement=$(echo "scale=2; (($cold_time - $warm_time) / $cold_time) * 100" | bc)
            echo "Build time improvement: ${improvement}%" | tee -a performance-analysis.txt
            
            # Calculate cache effectiveness
            if [ -f warm-cache-stats.txt ]; then
              hits=$(grep -o "cache hit.*[0-9]*" warm-cache-stats.txt | grep -o "[0-9]*" | tail -1 || echo "0")
              misses=$(grep -o "cache miss.*[0-9]*" warm-cache-stats.txt | grep -o "[0-9]*" | tail -1 || echo "1")
              total=$((hits + misses))
              
              if [ $total -gt 0 ]; then
                hit_ratio=$(echo "scale=2; ($hits * 100) / $total" | bc)
                echo "Cache hit ratio: ${hit_ratio}%" | tee -a performance-analysis.txt
                
                if [ $(echo "$hit_ratio > 80" | bc) -eq 1 ]; then
                  echo "Cache effectiveness: EXCELLENT (>80%)" | tee -a performance-analysis.txt
                elif [ $(echo "$hit_ratio > 60" | bc) -eq 1 ]; then
                  echo "Cache effectiveness: GOOD (60-80%)" | tee -a performance-analysis.txt
                elif [ $(echo "$hit_ratio > 30" | bc) -eq 1 ]; then
                  echo "Cache effectiveness: MODERATE (30-60%)" | tee -a performance-analysis.txt
                else
                  echo "Cache effectiveness: POOR (<30%)" | tee -a performance-analysis.txt
                fi
              fi
            fi
          fi
        else
          echo "No caching used - baseline measurement" | tee -a performance-analysis.txt
        fi
        
        echo "" | tee -a performance-analysis.txt
        cat performance-analysis.txt

    - name: Test Cache Consistency
      if: matrix.cache_type == 'ccache'
      working-directory: tol-master/tol/build-${{ matrix.cache_type }}-${{ matrix.compiler }}
      run: |
        echo "Testing cache consistency..."
        
        # Test basic functionality
        if [ -f "./tolcon" ]; then
          ./tolcon --version
          ./tolcon -c 'WriteLn("Cache consistency test: PASSED");'
          echo "✅ Cached build produces working executable"
        else
          echo "❌ Build failed to produce executable"
          exit 1
        fi

    - name: Archive Build Performance Results
      uses: actions/upload-artifact@v3
      with:
        name: build-performance-${{ matrix.cache_type }}-${{ matrix.compiler }}
        path: |
          tol-master/tol/build-${{ matrix.cache_type }}-${{ matrix.compiler }}/performance-analysis.txt
          tol-master/tol/build-${{ matrix.cache_type }}-${{ matrix.compiler }}/cold-build-time.txt
          tol-master/tol/build-${{ matrix.cache_type }}-${{ matrix.compiler }}/warm-build-time.txt
          tol-master/tol/build-${{ matrix.cache_type }}-${{ matrix.compiler }}/*-cache-stats.txt
          tol-master/tol/build-${{ matrix.cache_type }}-${{ matrix.compiler }}/cmake-config.log
        retention-days: 30

  # ============================================================================
  # Cache Size Optimization
  # ============================================================================
  cache-size-optimization:
    name: Cache Size Optimization
    runs-on: ubuntu-latest
    strategy:
      matrix:
        cache_size: [500M, 1G, 2G, 4G]
    
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          gcc-11 \
          g++-11 \
          cmake \
          ccache \
          libgsl-dev \
          liblapacke-dev \
          libblas-dev \
          libfftw3-dev \
          libbz2-dev \
          libsuitesparse-dev \
          libsparsehash-dev \
          libboost-all-dev \
          libltdl-dev \
          zlib1g-dev

    - name: Setup ccache with ${{ matrix.cache_size }}
      run: |
        ccache --version
        ccache --zero-stats
        ccache --max-size=${{ matrix.cache_size }}
        ccache --set-config=compression=true
        
        echo "Cache configuration:"
        ccache --show-config

    - name: Build with Cache Size ${{ matrix.cache_size }}
      working-directory: tol-master/tol
      env:
        CC: gcc-11
        CXX: g++-11
      run: |
        mkdir -p build-cache-${{ matrix.cache_size }}
        cd build-cache-${{ matrix.cache_size }}
        
        cmake .. \
          -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
          -DCMAKE_C_COMPILER_LAUNCHER=ccache \
          -DENABLE_TESTING=ON
        
        # Build multiple times to test cache behavior
        for i in 1 2 3; do
          echo "Build iteration $i with cache size ${{ matrix.cache_size }}"
          make clean
          make -j$(nproc) 2>&1 | tee build-$i.log
          ccache --show-stats > cache-stats-$i.txt
        done
        
        # Generate cache size report
        echo "=== Cache Size Analysis for ${{ matrix.cache_size }} ===" > cache-size-report.txt
        echo "Final cache statistics:" >> cache-size-report.txt
        ccache --show-stats >> cache-size-report.txt
        
        # Check cache usage
        cache_size_used=$(ccache --show-stats | grep "cache size" | grep -o "[0-9.]*" | head -1 || echo "0")
        echo "Cache size used: ${cache_size_used}" >> cache-size-report.txt
        
        cat cache-size-report.txt

    - name: Archive Cache Size Results
      uses: actions/upload-artifact@v3
      with:
        name: cache-size-analysis-${{ matrix.cache_size }}
        path: |
          tol-master/tol/build-cache-${{ matrix.cache_size }}/cache-size-report.txt
          tol-master/tol/build-cache-${{ matrix.cache_size }}/cache-stats-*.txt
        retention-days: 30

  # ============================================================================
  # Distributed Build Test
  # ============================================================================
  distributed-build-test:
    name: Distributed Build Simulation
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          gcc-11 \
          g++-11 \
          cmake \
          ccache \
          distcc \
          libgsl-dev \
          liblapacke-dev \
          libblas-dev \
          libfftw3-dev \
          libbz2-dev \
          libsuitesparse-dev \
          libsparsehash-dev \
          libboost-all-dev \
          libltdl-dev \
          zlib1g-dev

    - name: Setup ccache for Distributed Build
      run: |
        ccache --version
        ccache --zero-stats
        ccache --max-size=2G
        ccache --set-config=compression=true
        
        # Configure for potential distributed compilation
        export CCACHE_PREFIX="distcc"
        echo "CCACHE_PREFIX=distcc" >> $GITHUB_ENV

    - name: Test Different Parallelism Levels
      working-directory: tol-master/tol
      env:
        CC: gcc-11
        CXX: g++-11
      run: |
        for jobs in 1 2 4 8; do
          echo "Testing with -j$jobs"
          
          mkdir -p build-j$jobs
          cd build-j$jobs
          
          cmake .. \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DENABLE_TESTING=ON
          
          # Time the build
          start_time=$(date +%s)
          make -j$jobs 2>&1 | tee build-j$jobs.log
          end_time=$(date +%s)
          
          build_time=$((end_time - start_time))
          echo "Build time with -j$jobs: ${build_time}s" | tee build-time-j$jobs.txt
          
          cd ..
        done
        
        # Create parallelism analysis report
        echo "=== Parallelism Analysis ===" > parallelism-report.txt
        for jobs in 1 2 4 8; do
          if [ -f "build-j$jobs/build-time-j$jobs.txt" ]; then
            cat "build-j$jobs/build-time-j$jobs.txt" >> parallelism-report.txt
          fi
        done
        
        cat parallelism-report.txt

    - name: Archive Distributed Build Results
      uses: actions/upload-artifact@v3
      with:
        name: distributed-build-results
        path: |
          tol-master/tol/parallelism-report.txt
          tol-master/tol/build-j*/build-time-j*.txt
        retention-days: 30

  # ============================================================================
  # Build Cache Summary Report
  # ============================================================================
  cache-optimization-summary:
    name: Cache Optimization Summary
    runs-on: ubuntu-latest
    needs: [cache-performance-benchmark, cache-size-optimization, distributed-build-test]
    if: always()

    steps:
    - name: Download All Cache Results
      uses: actions/download-artifact@v3

    - name: Generate Cache Optimization Report
      run: |
        echo "# Build Cache Optimization Report" > cache_optimization_report.md
        echo "" >> cache_optimization_report.md
        echo "Generated on: $(date -u)" >> cache_optimization_report.md
        echo "" >> cache_optimization_report.md
        
        echo "## Performance Benchmark Results" >> cache_optimization_report.md
        echo "" >> cache_optimization_report.md
        echo "| Compiler | Cache Type | Status | Notes |" >> cache_optimization_report.md
        echo "|----------|------------|--------|-------|" >> cache_optimization_report.md
        
        # Process benchmark results
        for result in build-performance-*; do
          if [ -d "$result" ]; then
            cache_type=$(echo "$result" | cut -d'-' -f3)
            compiler=$(echo "$result" | cut -d'-' -f4)
            
            if [ -f "$result/performance-analysis.txt" ]; then
              improvement=$(grep "improvement:" "$result/performance-analysis.txt" | head -1 || echo "N/A")
              echo "| $compiler | $cache_type | Available | $improvement |" >> cache_optimization_report.md
            else
              echo "| $compiler | $cache_type | Missing | - |" >> cache_optimization_report.md
            fi
          fi
        done
        
        echo "" >> cache_optimization_report.md
        echo "## Cache Size Analysis" >> cache_optimization_report.md
        echo "" >> cache_optimization_report.md
        echo "Tested cache sizes: 500M, 1G, 2G, 4G" >> cache_optimization_report.md
        echo "" >> cache_optimization_report.md
        
        echo "## Recommendations" >> cache_optimization_report.md
        echo "" >> cache_optimization_report.md
        echo "1. **Optimal Cache Size**: 2G provides good balance between performance and disk usage" >> cache_optimization_report.md
        echo "2. **Compression**: Enable ccache compression (level 6) for better space efficiency" >> cache_optimization_report.md
        echo "3. **Parallelism**: Use -j$(nproc) for optimal build performance" >> cache_optimization_report.md
        echo "4. **CI Integration**: Cache ccache directory between runs for maximum benefit" >> cache_optimization_report.md
        echo "" >> cache_optimization_report.md
        
        echo "## Implementation Status" >> cache_optimization_report.md
        echo "" >> cache_optimization_report.md
        echo "- ✅ ccache integration configured" >> cache_optimization_report.md
        echo "- ✅ Cache compression enabled" >> cache_optimization_report.md
        echo "- ✅ GitHub Actions cache integration" >> cache_optimization_report.md
        echo "- ✅ Performance benchmarking implemented" >> cache_optimization_report.md
        echo "- ✅ Multi-compiler support (GCC/Clang)" >> cache_optimization_report.md
        
        cat cache_optimization_report.md

    - name: Upload Cache Optimization Summary
      uses: actions/upload-artifact@v3
      with:
        name: cache-optimization-summary
        path: cache_optimization_report.md
        retention-days: 90