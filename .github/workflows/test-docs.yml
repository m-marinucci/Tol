name: Test Documentation

on:
  push:
    branches: [ feat/auto-documentation ]
  pull_request:
    branches: [ master ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      
    - name: Test Step
      run: |
        echo "Documentation workflow is working!"
        echo "Branch: ${{ github.ref_name }}"
        echo "SHA: ${{ github.sha }}"